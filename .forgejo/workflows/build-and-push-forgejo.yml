name: Build and push to Forgejo Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        type: string
        required: false
        default: manual

jobs:
  docker:
    runs-on: office-server-amd64-ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.xd003.cc
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            git.xd003.cc/${{ github.repository }}:${{ github.event.inputs.tag || 'manual' }}
            git.xd003.cc/${{ github.repository }}:latest
